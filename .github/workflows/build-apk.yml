name: Build Sugar Pop APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build-debug:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Provision consistent debug keystore for CI signing
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            echo "Decoded debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
          elif [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from repository debug.keystore.base64."
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
          CI_VERSION_CODE: ${{ github.run_number }}
          CI_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: >
          gradle :app:assembleDebug
          -Dorg.gradle.parallel=false
          --max-workers=1
          -Dkotlin.compiler.execution.strategy=daemon
          "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"

      - name: Reset Gradle daemon before unit tests
        run: gradle --stop

      - name: Run Unit & Robolectric Tests
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: >
          gradle :app:testDebugUnitTest
          -Dorg.gradle.parallel=false
          --max-workers=1
          -Dkotlin.compiler.execution.strategy=daemon
          "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"

      - name: Prepare & Verify Debug APK file
        run: |
          APK_FILE=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK_FILE" sugar-pop-debug.apk
          ls -lh sugar-pop-debug.apk
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs sugar-pop-debug.apk
          fi

      - name: Publish Debug APK to GitHub Releases
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" sugar-pop-debug.apk --clobber
            else
              gh release create "$TAG" sugar-pop-debug.apk \
                --title "Sugar Pop $TAG" \
                --generate-notes
            fi
          else
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest sugar-pop-debug.apk \
              --target "$GITHUB_SHA" \
              --title "Sugar Pop Latest APK" \
              --notes "Automated debug APK build from commit ${GITHUB_SHA::7} (run #${GITHUB_RUN_NUMBER})."
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: sugar-pop-debug-apk
          path: sugar-pop-debug.apk
          if-no-files-found: error

  build-signed-release:
    name: Build Signed Release APK (when keystore secret is configured)
    needs: test-and-build-debug
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check signing secrets
        id: check_secrets
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets not configured; skipping release APK."
          fi

      - name: Set up JDK 21
        if: steps.check_secrets.outputs.configured == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        if: steps.check_secrets.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Decode upload keystore
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Build Signed Release APK
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CI_VERSION_CODE: ${{ github.run_number }}
          CI_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: >
          gradle :app:assembleRelease
          -Dorg.gradle.parallel=false
          --max-workers=1
          -Dkotlin.compiler.execution.strategy=daemon
          "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"

      - name: Prepare Release APK file
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_FILE" sugar-pop-release.apk
          ls -lh sugar-pop-release.apk

      - name: Attach Release APK to GitHub Releases
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="latest"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" sugar-pop-release.apk --clobber
          else
            gh release create "$TAG" sugar-pop-release.apk \
              --target "$GITHUB_SHA" \
              --title "Sugar Pop $TAG" \
              --generate-notes
          fi

      - name: Upload Release APK Artifact
        if: steps.check_secrets.outputs.configured == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: sugar-pop-release-apk
          path: sugar-pop-release.apk
          if-no-files-found: error
