name: Build Sugar Pop APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build-debug:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Generate debug keystore for CI signing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: >
          gradle :app:assembleDebug
          -Dorg.gradle.parallel=false
          --max-workers=1
          -Dkotlin.compiler.execution.strategy=daemon
          "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"

      - name: Reset Gradle daemon before unit tests
        run: gradle --stop

      - name: Run Unit & Robolectric Tests
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: >
          gradle :app:testDebugUnitTest
          -Dorg.gradle.parallel=false
          --max-workers=1
          -Dkotlin.compiler.execution.strategy=daemon
          "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: sugar-pop-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-signed-release:
    name: Build Signed Release APK (when keystore secret is configured)
    needs: test-and-build-debug
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check signing secrets
        id: check_secrets
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets not configured; skipping release APK."
          fi

      - name: Set up JDK 21
        if: steps.check_secrets.outputs.configured == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        if: steps.check_secrets.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Decode upload keystore
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Build Signed Release APK
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          gradle :app:assembleRelease
          -Dorg.gradle.parallel=false
          --max-workers=1
          -Dkotlin.compiler.execution.strategy=daemon
          "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"

      - name: Upload Release APK Artifact
        if: steps.check_secrets.outputs.configured == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: sugar-pop-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach Release APK to GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_secrets.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/release/*.apk --clobber
          else
            gh release create "$TAG" app/build/outputs/apk/release/*.apk --title "$TAG" --generate-notes
          fi
